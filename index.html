<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudita Sharma - Data Engineer & Tech Mentor</title>
    <style>
        :root {
            --bg-black: #000000;
            --card-bg: #070b12;
            --code-bg: #04070d;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            
            /* Electric Green & Blue Palette */
            --electric-blue: #00d2ff;
            --cyan-blue: #38bdf8;
            --neon-green: #22c55e;
            --light-green: #4ade80;
            --badge-bg: #031525;
            --glow-green: rgba(34, 197, 94, 0.2);
            --glow-blue: rgba(0, 210, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-black);
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* Ambient Glow Background Effect */
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 1200px;
            height: 600px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.08) 0%, rgba(0, 210, 255, 0.06) 50%, rgba(0,0,0,0) 80%);
            pointer-events: none;
            z-index: 0;
        }

        /* Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 1.2rem 2rem;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--neon-green);
            text-decoration: none;
            letter-spacing: 1.5px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--electric-blue);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Color Utility Classes */
        .text-green { color: var(--neon-green); }
        .text-light-green { color: var(--light-green); }
        .text-blue { color: var(--electric-blue); }
        .text-cyan { color: var(--cyan-blue); }

        /* Hero Section */
        header.hero {
            padding: 6rem 0 5rem;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 3rem;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-tagline {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--light-green);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hero-tagline::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-green);
        }

        /* NAME TYPOGRAPHY */
        .hero-name {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -1.5px;
            margin-bottom: 0.8rem;
            background: linear-gradient(135deg, #ffffff 30%, var(--light-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* DUAL HEADLINES */
        .headline-primary {
            font-size: 2.2rem;
            line-height: 1.25;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .headline-secondary {
            font-size: 1.8rem;
            line-height: 1.25;
            font-weight: 800;
            background: linear-gradient(90deg, var(--electric-blue), var(--light-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
        }

        .hero-description {
            color: var(--text-sub);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            max-width: 580px;
            line-height: 1.7;
        }

        /* Mentorship Highlight Card */
        .mentor-badge-card {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            background-color: var(--badge-bg);
            border: 1px solid var(--neon-green);
            padding: 0.8rem 1.4rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px var(--glow-green);
        }

        .mentor-number {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-green);
            line-height: 1;
        }

        .mentor-text {
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .hero-buttons {
            display: flex;
            gap: 1.2rem;
        }

        /* Hero Code Window */
        .code-window {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.8rem;
            font-family: 'Fira Code', Consolas, Monaco, monospace;
            font-size: 0.85rem;
            box-shadow: 0 0 40px rgba(0, 210, 255, 0.12);
            transition: border-color 0.3s ease;
        }

        .code-window:hover {
            border-color: var(--electric-blue);
        }

        .code-dots {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #f59e0b; }
        .dot-green { background-color: var(--neon-green); }

        .code-line { margin-bottom: 0.5rem; color: var(--text-sub); }
        .keyword { color: var(--electric-blue); }
        .function { color: var(--light-green); }
        .string { color: #f472b6; }
        .status { color: var(--neon-green); font-size: 0.8rem; margin-top: 1.5rem; display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }

        /* Section Layout */
        section {
            padding: 5rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 2.2rem;
            margin-bottom: 2.5rem;
            color: var(--electric-blue);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 800;
        }

        /* Career History Section */
        .timeline {
            position: relative;
            padding-left: 2rem;
            border-left: 2px solid var(--border-color);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2.5rem;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -2.55rem;
            top: 0.2rem;
            width: 16px;
            height: 16px;
            background-color: var(--neon-green);
            border-radius: 50%;
            border: 3px solid var(--bg-black);
            box-shadow: 0 0 10px var(--neon-green);
        }

        .timeline-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            transition: border-color 0.3s ease;
        }

        .timeline-content:hover {
            border-color: var(--electric-blue);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .role-title {
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 700;
        }

        .company-name {
            color: var(--electric-blue);
            font-weight: 600;
        }

        .timeline-date {
            font-size: 0.85rem;
            color: var(--light-green);
            background-color: var(--badge-bg);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-weight: 600;
        }

        .timeline-body p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 0.6rem;
        }

        /* Projects Section */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-6px);
            border-color: var(--electric-blue);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.15);
        }

        .project-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .project-content {
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .project-content h3 {
            color: var(--light-green);
            font-size: 1.25rem;
            margin-bottom: 0.6rem;
        }

        .project-content p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }

        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .tag {
            background-color: var(--badge-bg);
            color: var(--cyan-blue);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* About Grid */
        .about-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 3rem;
            align-items: center;
        }

        .about-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.8rem;
            transition: border-color 0.3s ease, transform 0.2s ease;
        }

        .skill-card:hover {
            border-color: var(--neon-green);
            transform: translateY(-3px);
        }

        .skill-card h4 {
            color: var(--electric-blue);
            font-size: 1.1rem;
            margin-bottom: 0.6rem;
        }

        .skill-card p {
            font-size: 0.95rem;
            color: var(--text-sub);
        }

        /* Certifications Grid */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.8rem;
        }

        .cert-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .cert-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-green);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.12);
        }

        .cert-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .cert-issuer {
            font-size: 0.95rem;
            color: var(--electric-blue);
            margin-bottom: 0.6rem;
            font-weight: 600;
        }

        .cert-details {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-bottom: 1.5rem;
        }

        .cert-id {
            font-family: monospace;
            background: var(--badge-bg);
            color: var(--light-green);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            display: inline-block;
            margin-top: 0.4rem;
            border: 1px solid var(--border-color);
            font-size: 0.8rem;
        }

        .cert-actions {
            margin-top: auto;
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            text-decoration: none;
            color: #000000;
            background-color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 0.85rem 1.8rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 800;
            transition: all 0.25s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            background-color: var(--light-green);
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.5);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--cyan-blue);
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            background-color: var(--badge-bg);
            border-color: var(--electric-blue);
            color: #ffffff;
        }

        /* REDESIGNED FORM-FREE CONTACT SECTION */
        .contact-card-wrapper {
            background: linear-gradient(135deg, var(--card-bg) 0%, #0c1424 100%);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3.5rem;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.1);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .contact-card-wrapper::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 200px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .contact-header {
            max-width: 700px;
            margin: 0 auto 3rem auto;
        }

        .contact-header h3 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .contact-header p {
            color: var(--text-sub);
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .contact-grid-clean {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .contact-card-clean {
            background-color: var(--badge-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.8rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .contact-card-clean:hover {
            border-color: var(--electric-blue);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.15);
        }

        .contact-icon-large {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
        }

        .contact-card-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

            color: var(--light-green);
            font-weight:
